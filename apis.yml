aid: dripshop
name: Dripshop
description: >-
  Drip Shop Live (legal entity Flourish Cares, Inc. DBA Drip Shop Live) is a livestream
  shopping marketplace and community built for collectors. Sellers host live streams to run
  realtime auctions, box breaks, provably-fair pull games and giveaways across trading cards
  (Pokémon, Magic, Yu-Gi-Oh!, Digimon), sports cards and other collectibles, while buyers
  watch, bid, chat and check out in-stream and earn Drip Coin rewards. The platform is
  crypto-native — wallet sign-in, Solana, Base and a Farcaster mini-app — alongside Stripe
  and PayPal payments, and is backed by Kindred Ventures. It runs on a single first-party
  GraphQL API (introspection enabled) powering its iOS, Android and web clients.
