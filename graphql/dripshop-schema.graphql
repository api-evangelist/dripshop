type CartChatLinkError implements Error {
  message: String!
}

type CartChatLinkSuccess {
  data: String!
}

"""Simple lookup object, this will provide ids and access creds if needed too. This represents several intersection of states where the user may have potential access to the cart.  1. User is authed and has ownership of the cart: Just a cartId will be provided. The client can continue interacting without any special actions. 2. User is authed, but does not own the cart and no one else owns the cart. chatLookupToken will be provided. Claim the cart immediately in this case so that it can be merged with the current user's cart. 3. User is authed but someone else owns this cart: needsImmediateLogin will be set to true. Prompt the user to log into the correct account linked with the user. 4. User is not authed and someone else owns this cart: needsImmediateLogin will be set to true. The correct user must be logged into to continue. 5. User is not authed and no one else owns the cart: Use cartId and chatLookupToken until checkout, then force the user to login and run claimCart using the cartId and cartLookupToken"""
type CartChatLookup {
  """The cart id the original lookup token is for. This will be needed for cart crud operations if the `chatLookupToken` is also set or `ownsCart` is set to `false`"""
  cartId: String!
  """This is provided if the current client is not authed, but they can act in an unauthed fashion on the cart until the last moment. This is most likely going to be the most common flow. Use this token to do crud operations when the argument specifies it.  **NOTE: This expires after an hour, refresh this token every so often.**"""
  chatLookupToken: String
  chatLookupTokenExpiration: DateTime
  """This means that a cart is attached to the credentials provided, but you are either logged into another user other than the one referrer link expects (ex: The facebook user expected for the cart is not attached to the currently authed user). Orrrr the client is not logged in but not to the correct account. To protect that user's privacy they need to auth immediately."""
  needsImmediateLogin: Boolean!
  """Cart is owned by user. You do not need to do anything special when this is true"""
  ownsCart: Boolean!
  """This means the client is coming from a simulcast display **ONLY** that seller's storefront and filter the cart and checkout by this sellerId"""
  sellerId: Int
  """The simulcast instance referrer, this is unused anywhere at the moment but will eventually become relavent during checkout."""
  simulcastInstanceId: String
  """This means the client is coming from a simulcast display too. This hints at the client to show this stream's information."""
  streamId: Int
}

type CartCheckoutSubTotalDetails {
  """A hash of the current state of the cart. This is very useful for a checkout                     flow where you want the drip prepurchase screen to the vendor purchase screen                     to match exactly. Carts otherwise can occassionaly drift state if quantity or                     pricing change in the interim.                      This also prevents a seller changing an item to a new title or description                     without the user discovering first.                      If a flash sale has ended or changed price, this will also help.                      You can pass this along with the cart id to the create payment apis and it will                     return an error if the new cart hash doesn't match.                      NOTE: this query is also expensive. This should only be queryed when needed."""
  hash: String!
  subTotal: Float!
}

type CartCheckoutSubTotalInfo {
  """Will not exist if the cart is not valid"""
  details: CartCheckoutSubTotalDetails
  errorMsg: String
  isValid: Boolean!
}

