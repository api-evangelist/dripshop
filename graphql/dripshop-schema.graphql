"""Formalized lookup for a cart. A cart can be looked up a bunch of different ways. The client's identity determines which arguments it can use. For external clients, you only need to pay attention to cartId and cartKey as those can lookup a cart from an unauthed context. Other methods include looking up by some external account ids. This simplifies other services not having to manage the tricky bits of cart ownership. Leave arguments null if you do not want to look up by them. You can only look up by one method. Others will get overridden. The order of precendence is as follows:  1. cartId/cartKey 2. userId 3. externalIds such as facebookUserId or twitchUserId"""
input CartLookupInput {
  """Look up the cart directly, provide the cart key if you are from an external client too."""
  cartId: String
  """This key is used for claiming a cart and operating on a cart from an external client. Drip does not store this code, only a hash. So if this is lost, the cart is inaccessible.  This is removed once the cart is claimed by a user too.  This is unneeded if client has elevated permissions (admin or trusted service), but still can be set if needed to replicate permission structure."""
  cartKey: String
  """This token is a short lived token that can be used to also access the cart. This requires also providing the cart id too.  You can get this from the cartChatLookup. It's really only meant to be used with the chat bot."""
  chatLookupToken: String
  """Look up by facebookUserId. This will return a user's cart if the facebookUser is linked to one, otherwise an anonymous cart. Be careful with that implication.  This is only available to admins and privileged services."""
  facebookUserId: String
  """Look up by twitchUserId. This will return a user's cart if the twitchUser is linked to one, otherwise an anonymous cart. Be careful with that implication.  This is only available to admins and privileged services."""
  twitchUserId: String
  """Look up by a userId. This is only available to admins and privileged services."""
  userId: Int
}

