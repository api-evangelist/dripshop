type Shipment implements Node {
  addressFrom: String
  addressTo: String
  buyer: User
  buyerAddress: SavedAddress
  buyerId: Int
  carrierName: String
  createdAt: String!
  """Unmangled id, not the relay one. Use this for display"""
  dripId: Int!
  eta: String
  """This is passed pretty much verbatim to Shippo. This is from pre-typescript so not much has been done and it is a little unclear what exactly is in this blob in historical data"""
  extras: ShipmentExtra!
  hasRate: Boolean!
  id: ID!
  labelFileType: String
  """The original address details. However this may have changed since then. Use only for reference."""
  originalAddress: SavedAddress @deprecated
  """Shipment parcel info"""
  parcel: ShipmentParcel!
  refunded: Boolean!
  seller: User!
  sellerId: Int!
  """External id for shipment management with a vendor"""
  shipmentObjectId: String
  """This is only set once a user has paid a rate"""
  shipmentRate: Float
  """This is one of the most important fields."""
  shipped: Boolean!
  shippingLabelCombinedUrl: String
  shippingLabelUrl: String
  trackingNumber: String
  trackingStatus: String
  trackingStatusDetails: String
  trackingUrl: String
