"""Info around joining drip/connecting an account to drip that will have a cart item auto added. The main purpose of this is for environments where we will send someone that has potentially not authed with Drip to join and get a cart seeded with an item.  When this is employed, the backend has literally no idea about the user when a link is generated. This data encapsulates the several states that can occur once a client has followed the link and sent it back to us with any potential auth info attached.  These are:    1. User is authed, but potentially has not authed with this link. You could compare if the product id returned and optional simulcast instance id match anything in their current cart   2. User is authed and someone has authed with this id, this data is temporary and disappears after several months, but we will check to see if this oauth link had someone connect an account with it, along with seeing if that account was attached to this user. The client can decide with the data provided whether to roll the dice and just forward the user directly to the cart.   3. No one is logged in. Use the data provided to display the appropriate oauth link"""
type OAuthCartJoinInfo {
  """An account was connected with this token/link AND this user owns that account. This is a **super strong** singifier to show the cart."""
  doesOwnConnectedAccount: Boolean!
  """If this is a facebook provider, expose it"""
  facebookOAuthUrl: String!
  """You could display some pertinent info/copy in this case."""
  hasPurchasedFromSeller: Boolean!
  """You could display some pertinent info/copy in this case."""
  hasPurchasedFromSimulcastInstance: Boolean!
  """You could display some pertinent info/copy in this case."""
  hasPurchasedProduct: Boolean!
  """User is authed... you most likely already know this though. This is a weak signifier to follow the cart link. Buuut maybe you could display a cart/seller page and simply prompt the user."""
  isAuthed: Boolean!
  product: Product!
  productId: Int!
  provider: OAuthProviderType!
  """A potential seller for the product"""
  seller: User
  """A stream that may exist for this token"""
  stream: Stream
  """This specific token/link has had _someone_ auth an account with it. This is a a decent singifier to show the cart."""
  tokenHasBeenConnected: Boolean!
}

